案例名称: 可能的急性冠脉综合征NSTE（UA/NSTEMI疑似）
中文说明: "适用于疑似ACS（NSTE-ACS：不伴ST段抬高的UA/NSTEMI）风险评估与早期处置流程。要求在规定时间窗内完成心电图解读与风险分层，形成抗栓/抗血小板与监护、镇痛/供氧的协同策略；同时根据病情决定是否需要升级处置与转运，并在转运/交接前完成目的地选择与ED通知闭环，最后进行复评与记录。"
人群信息:
    患者组: "成人"

场景信息:
    场景设置: "院前急救"
    时间窗: "初始"
    脉搏状态: "未知"
    节律可见性: "未知"
    资源限制:
        除颤器可用性: "未知"
        药物可用性: "未知"
    血流动力学稳定性: "未知"
    心搏骤停子类: "未知"
    心动过速子类: "未知"
    心动过缓子类: "未知"
    急性冠脉综合征子类: "疑似NSTE-ACS/UA（可能）"
    神经系统综合征: "未知"

中文概述: "疑似NSTE-ACS/UA：在规定时间窗内完成关键评估与风险分层证据链，推进处置主线，并完成转运/交接闭环与复评要点。"
中文关键触发:
    - "急性冠脉综合征子类=疑似NSTE-ACS/UA（可能）"
中文教学关注: "疑似NSTE-ACS/UA识别后的证据链闭环教学：初始评估→风险分层→处置主线→复评→转运/交接触发与要点输出。"

教学目标:
    - 目标编号: "OBJ_ACS_NSTEUA_01"
      目标内容: "完成疑似NSTE-ACS/UA的关键评估与风险分层证据链，并触发对应处置主线。"
      主要评分: true
    - 目标编号: "OBJ_ACS_NSTEUA_02"
      目标内容: "在规定时间窗内完成转运目的地选择、急诊通知与交接闭环证据输出。"
      主要评分: true
    - 目标编号: "OBJ_ACS_NSTEUA_03"
      目标内容: "在后续时间窗内完成复评并更新关键证据，形成闭环输出。"
      主要评分: false

