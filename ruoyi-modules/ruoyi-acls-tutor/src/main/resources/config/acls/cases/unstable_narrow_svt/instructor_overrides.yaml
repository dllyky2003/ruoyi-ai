case_id: unstable_narrow_svt
version: 0.1.0

instructor_overrides:
  - override_id: IO_PAUSE_CLOCK
    name: "导师暂停时钟"
    allowed_when:
      attempt_status: RUNNING
    action:
      type: clock_control
      operation: pause
    requires_reason: false
    audit_required: true
    affects_formative_score: false
    review:
      review_status: approved
      reviewer_id: test_architect
      reviewer_role: architect
      review_date: "2026-09-21"

  - override_id: IO_FORCE_SYNC_MODE
    name: "导师强制开启 SYNC 模式"
    allowed_when:
      attempt_status: RUNNING
    action:
      type: device_control
      operation: enable_sync
    requires_reason: true
    audit_required: true
    affects_formative_score: false
    review:
      review_status: approved
      reviewer_id: test_architect
      reviewer_role: architect
      review_date: "2026-09-21"
