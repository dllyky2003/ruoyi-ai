# ============================================================================
# stable_narrow/specific.yaml - 窄QRS稳定心动过速专属技能
# 只有该案例特有的判读/评估技能
# ============================================================================

skills:
  # -------- 专属判读技能 --------
  - id: assert_qrs_width
    duty: MONITOR_DEFIB
    type: generic_assert
    params:
      sourceVar: phys.qrsDuration
      assertExpression: "#phys.qrsDuration != null && #phys.qrsDuration <= 0.12 ? 'narrow' : 'wide'"
      targetVar: assert.qrsWidth
      successSpeech: "QRS宽度 {value}。"
      valueMap:
        unknown: "待判读"
        narrow: "窄QRS"
        wide: "宽QRS"
      prerequisites:
        - variable: process.ecgRecorded
          expected: true
          message: "请先完成 12导联心电图记录！"

  - id: assert_rhythm_regular
    duty: MONITOR_DEFIB
    type: generic_assert
    params:
      sourceVar: phys.rrIntervalJitter
      assertExpression: "#phys.rrIntervalJitter != null && #phys.rrIntervalJitter < 0.12"
      targetVar: assert.rhythmRegular
      successSpeech: "节律 {value}。"
      valueMap:
        unknown: "待判读"
        true: "规则"
        false: "不规则"
      prerequisites:
        - variable: process.ecgRecorded
          expected: true
          message: "请先完成 12导联心电图记录！"

  - id: assert_hemodynamics
    duty: ASSESS
    type: generic_assert
    params:
      sourceVars: [phys.systolicBp, phys.consciousness, phys.respiratoryRate]
      assertExpression: "#phys.systolicBp >= 90 && #phys.consciousness == 'alert' && #phys.respiratoryRate >= 10 && #phys.respiratoryRate <= 30"
      targetVar: assert.stable
      successSpeech: "血流动力学 {value}。"
      valueMap:
        unknown: "待判读"
        true: "稳定"
        false: "不稳定"

  # -------- 专属标准操作 --------
  - id: vagal_maneuver
    duty: ASSESS
    type: standard
    params:
      vrActionCode: "VAGAL_MANEUVER"
      durationSeconds: 5
      successVar: intervention.vagalManeuverPerformed
      successSpeech: "迷走神经刺激已完成。"

  - id: drug_push_adenosine
    duty: IV_MED
    type: standard
    params:
      vrActionCode: "ADENOSINE_PUSH"
      durationSeconds: 2
      timeoutSeconds: 5
      doseSequence: first
      successVar: intervention.adenosineGiven
      successSpeech: "腺苷推注已完成。"
  # ============================================================
  # 警示 / 宣告型技能（S 类意图统一入口，全部复用 GenericActionSkill）
  # 模式：配置 vrActionCode + duration + successSpeech + outputs
  # ============================================================

  - name: wpw_warning
    type: generic
    duty: ASSESS
    vrActionCode: WPW_ALERT
    duration: 1
    successSpeech: "⚠️ 预激综合征警示：禁用腺苷、CCB、β受体阻滞剂、地高辛；预激合并窄QRS（顺向型AVRT）时腺苷可谨慎使用。"
    outputs:
      process.wpwAlertTriggered: true

  - name: alert_drug_induced_vf
    type: generic
    duty: ASSESS
    vrActionCode: DRUG_INDUCED_VF_ALERT
    duration: 1
    successSpeech: "⚠️ 药物诱发室颤，立即启动 ACLS。"
    outputs:
      process.drugInducedVfAlertShown: true

  - name: alert_unsync_shock_vf
    type: generic
    duty: ASSESS
    vrActionCode: UNSYNC_SHOCK_VF_ALERT
    duration: 1
    successSpeech: "⚠️ 非同步电击致室颤，立即除颤。"
    outputs:
      process.unsynchronizedShockVfAlertShown: true

  - name: alert_pea_asystole
    type: generic
    duty: ASSESS
    vrActionCode: PEA_ASYSTOLE_ALERT
    duration: 1
    successSpeech: "⚠️ PEA/停搏，立即开始 CPR。"
    outputs:
      process.peaAsystoleAlertShown: true

  - name: block_forbidden_action
    type: generic
    duty: ASSESS
    vrActionCode: FORBIDDEN_ACTION_BLOCK
    duration: 1
    successSpeech: "⛔ 稳定窄QRS禁忌操作，已拦截。"
    outputs:
      process.contraindicationBlockTriggered: true

  - name: report_treatment_result
    type: generic
    duty: ASSESS
    vrActionCode: TREATMENT_RESULT_REPORT
    duration: 1
    successSpeech: "治疗结果已记录。"
    outputs:
      process.treatmentResultReported: true

  - name: alert_hemodynamic_deterioration
    type: generic
    duty: ASSESS
    vrActionCode: HEMODYNAMIC_DETERIORATION_ALERT
    duration: 1
    successSpeech: "⚠️ 血流动力学恶化，准备紧急电复律。"
    outputs:
      process.hemodynamicDeteriorationAlert: true

  - name: insert_npa
    type: generic
    duty: AIRWAY
    vrActionCode: INSERT_NPA
    duration: 2
    successSpeech: "已插入鼻咽通气管。"
    outputs:
      device.npaPlaced: true

