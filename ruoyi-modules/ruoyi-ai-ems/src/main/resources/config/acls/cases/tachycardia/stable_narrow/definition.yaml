# ============================================================
# 案例ID: 窄QRS稳定心动过速（完整版）
# ============================================================
caseId: "stable_narrow"
caseName: "窄QRS稳定心动过速"
version: "v3.0.0"

stateDescriptions:
  "INITIAL_SETUP": "初始设置阶段 - 需完成：开启监护仪、连接电极片、建立静脉通路"
  "INITIAL_ASSESSMENT": "初始评估阶段 - 正在评估患者基本情况"
  "ASSESS_STABILITY": "评估血流动力学稳定性 - 判断患者是否稳定"
  "CHECK_QRS_WIDTH": "判读QRS宽度 - 区分窄QRS与宽QRS心动过速"
  "NARROW_QRS_CHECK_RHYTHM": "窄QRS节律判断 - 判断心律是否规则"
  "DO_VAGAL_MANEUVER": "执行迷走神经刺激 - 尝试终止室上速"
  "ASSESS_VAGAL_EFFECT": "评估迷走效果 - 判断是否转复窦性"
  "DO_ADENOSINE_6MG": "推注腺苷6mg - 首剂治疗"
  "ASSESS_6MG_EFFECT": "评估6mg效果 - 判断是否转复"
  "DO_ADENOSINE_12MG": "推注腺苷12mg - 次剂治疗"
  "ASSESS_12MG_EFFECT": "评估12mg效果 - 判断是否转复"
  "DO_SECOND_LINE_DRUG": "二线药物治疗 - 备选方案"
  "ASSESS_SECOND_EFFECT": "评估二线药物效果"
  "EXPERT_CONSULTATION": "专家会诊 - 寻求上级支持"
  "STABLE_CARDIOVERSION": "稳定电复律 - 同步电复律"
  "UNSTABLE_CARDIOVERSION": "紧急电复律 - 不稳定患者紧急处理"
  "MONITOR_SINUS_RHYTHM": "窦性心律监测 - 观察转复后情况"
  "WIDE_QRS_ALGORITHM": "宽QRS算法 - 转诊/升级治疗"
  "IRREGULAR_RHYTHM_ALGORITHM": "不规则心律算法 - 房颤/房扑处理"
  "ERROR_HANDLING": "错误处理 - 纠正异常操作"
  "TIMEOUT_HANDLING": "延时处理 - 操作超时应对"
  "TERMINAL_END": "案例结束 - 救治完成或终止"

stateMachine:
  initial: "INITIAL_SETUP"

  allowUnlistedTransitions: true
  defaultTransitionAction: "actionLogDeviation"

  intentToStateMapping:
    # S类
    "S1-1": "CHECK_QRS_WIDTH"
    "S1-2": "NARROW_QRS_CHECK_RHYTHM"
    "S1-3": "ASSESS_STABILITY"
    "S1-4": "NARROW_QRS_CHECK_RHYTHM"
    "S2-1": "DO_VAGAL_MANEUVER"
    "S2-2": "DO_ADENOSINE_6MG"
    "S2-4": "DO_ADENOSINE_6MG"
    "S2-5": "DO_SECOND_LINE_DRUG"
    "S2-6": "UNSTABLE_CARDIOVERSION"
    "S2-7": "ERROR_HANDLING"
    "S2-9": "MONITOR_SINUS_RHYTHM"
    "S3-1": "UNSTABLE_CARDIOVERSION"
    "S3-2": "UNSTABLE_CARDIOVERSION"
    "S4-1": "ERROR_HANDLING"
    "S4-2": "ERROR_HANDLING"
    "S4-3": "ERROR_HANDLING"
    "S4-4": "ERROR_HANDLING"
    # G类
    "G3-1": "INITIAL_SETUP"
    "G3-2": "INITIAL_SETUP"
    "G3-3": "INITIAL_SETUP"

  globalEventIntents:
    - "G1-1"
    - "G1-2"
    - "G1-3"
    - "G2-1"
    - "G2-2"
    - "G2-3"
    - "G2-4"
    - "G2-5"
    - "G2-6"
    - "G2-7"
    - "G2-8"
    - "G4-1"
    - "G4-2"
    - "G4-3"
    - "G4-4"
    - "G4-5"
    - "G4-6"

  states:
    - "INITIAL_SETUP"
    - "INITIAL_ASSESSMENT"
    - "ASSESS_STABILITY"
    - "CHECK_QRS_WIDTH"
    - "NARROW_QRS_CHECK_RHYTHM"
    - "DO_VAGAL_MANEUVER"
    - "ASSESS_VAGAL_EFFECT"
    - "DO_ADENOSINE_6MG"
    - "ASSESS_6MG_EFFECT"
    - "DO_ADENOSINE_12MG"
    - "ASSESS_12MG_EFFECT"
    - "DO_SECOND_LINE_DRUG"
    - "ASSESS_SECOND_EFFECT"
    - "EXPERT_CONSULTATION"
    - "STABLE_CARDIOVERSION"
    - "UNSTABLE_CARDIOVERSION"
    - "MONITOR_SINUS_RHYTHM"
    - "WIDE_QRS_ALGORITHM"
    - "IRREGULAR_RHYTHM_ALGORITHM"
    - "ERROR_HANDLING"
    - "TIMEOUT_HANDLING"
    - "TERMINAL_END"

  endStates:
    - "MONITOR_SINUS_RHYTHM"
    - "WIDE_QRS_ALGORITHM"
    - "IRREGULAR_RHYTHM_ALGORITHM"
    - "TERMINAL_END"

  transitions:
    # === 初始设备准备 ===
    - source: "INITIAL_SETUP"
      target: "INITIAL_ASSESSMENT"
      intentCode: "G3-1"
      condition: "true"
      event: "setup_monitor_on"
      action: "actionLogTransition"
      description: "监护/除颤仪已开启，开始评估"

    - source: "INITIAL_SETUP"
      target: "INITIAL_SETUP"
      intentCode: "G3-2"
      condition: "true"
      event: "setup_pads_on"
      action: "actionLogTransition"
      description: "电极片已连接"

    - source: "INITIAL_SETUP"
      target: "INITIAL_SETUP"
      intentCode: "G3-3"
      condition: "true"
      event: "setup_iv_access"
      action: "actionLogTransition"
      description: "静脉通路已建立"

    # === 初始评估 ===
    - source: "INITIAL_ASSESSMENT"
      target: "ASSESS_STABILITY"
      intentCode: "S1-3"
      condition: "#asserted_stable == true"
      event: "S1-3_stable"
      action: "actionLogTransition"
      description: "学员评估为稳定"

    - source: "INITIAL_ASSESSMENT"
      target: "UNSTABLE_CARDIOVERSION"
      intentCode: "S1-3"
      condition: "#asserted_stable == false"
      event: "S1-3_unstable"
      action: "actionUrgentCardioversion"
      description: "学员评估为不稳定→紧急电复律"

    - source: "INITIAL_ASSESSMENT"
      target: "INITIAL_ASSESSMENT"
      intentCode: "S1-1"
      condition: "true"
      event: "S1-1_early"
      action: "actionLogTransition"
      description: "早期判读QRS宽度（可回退）"

    - source: "INITIAL_ASSESSMENT"
      target: "INITIAL_ASSESSMENT"
      intentCode: "S1-2"
      condition: "true"
      event: "S1-2_early"
      action: "actionLogTransition"
      description: "早期判读节律（可回退）"

    # === 稳定性评估 ===
    - source: "ASSESS_STABILITY"
      target: "CHECK_QRS_WIDTH"
      intentCode: "S1-3"
      condition: "#asserted_stable == true"
      event: "S1-3_stable"
      action: "actionLogTransition"
      description: "确认稳定，继续QRS判读"

    - source: "ASSESS_STABILITY"
      target: "UNSTABLE_CARDIOVERSION"
      intentCode: "S3-1"
      condition: "true"
      event: "S3-1_worsened"
      action: "actionUrgentCardioversion"
      description: "❗患者恶化→紧急电复律"

    - source: "ASSESS_STABILITY"
      target: "INITIAL_ASSESSMENT"
      intentCode: "S1-1"
      condition: "true"
      event: "reassess_qrs_from_stability"
      action: "actionLogTransition"
      description: "回溯重新判读QRS"

    - source: "ASSESS_STABILITY"
      target: "ASSESS_STABILITY"
      intentCode: "S1-3"
      condition: "true"
      event: "S1-3_repeat"
      action: "actionLogTransition"
      description: "重复评估稳定性"

    # === QRS宽度判断 ===
    - source: "CHECK_QRS_WIDTH"
      target: "NARROW_QRS_CHECK_RHYTHM"
      intentCode: "S1-1"
      condition: "#asserted_qrs_width == 'narrow'"
      event: "S1-1_narrow"
      action: "actionLogTransition"
      description: "窄QRS→继续节律判断"

    - source: "CHECK_QRS_WIDTH"
      target: "WIDE_QRS_ALGORITHM"
      intentCode: "S1-1"
      condition: "#asserted_qrs_width == 'wide'"
      event: "S1-1_wide"
      action: "actionSwitchAlgorithm"
      description: "⚠️宽QRS→转宽QRS算法（本案例结束）"

    - source: "CHECK_QRS_WIDTH"
      target: "CHECK_QRS_WIDTH"
      intentCode: "S1-1"
      condition: "true"
      event: "S1-1_repeat"
      action: "actionLogTransition"
      description: "重复判读QRS宽度"

    - source: "CHECK_QRS_WIDTH"
      target: "ASSESS_STABILITY"
      intentCode: "S1-3"
      condition: "true"
      event: "reassess_stability"
      action: "actionLogTransition"
      description: "回溯重新评估稳定性"

    # === 节律规则性判断（核心分支点） ===
    - source: "NARROW_QRS_CHECK_RHYTHM"
      target: "DO_VAGAL_MANEUVER"
      intentCode: "S1-2"
      condition: "#asserted_rhythm_regular == true"
      event: "S1-2_regular"
      action: "actionLogTransition"
      description: "规则→执行迷走神经刺激"

    - source: "NARROW_QRS_CHECK_RHYTHM"
      target: "IRREGULAR_RHYTHM_ALGORITHM"
      intentCode: "S1-2"
      condition: "#asserted_rhythm_regular == false"
      event: "S1-2_irregular"
      action: "actionSwitchAlgorithm"
      description: "⚠️不规则→转不规则算法（本案例结束）"

    - source: "NARROW_QRS_CHECK_RHYTHM"
      target: "NARROW_QRS_CHECK_RHYTHM"
      intentCode: "S1-2"
      condition: "true"
      event: "S1-2_repeat"
      action: "actionLogTransition"
      description: "重复判读节律"

    - source: "NARROW_QRS_CHECK_RHYTHM"
      target: "CHECK_QRS_WIDTH"
      intentCode: "S1-1"
      condition: "true"
      event: "reassess_qrs"
      action: "actionLogTransition"
      description: "回溯重新判读QRS宽度"

    # === 迷走神经刺激 ===
    # 原有规则：学员完成操作后触发
    - source: "DO_VAGAL_MANEUVER"
      target: "ASSESS_VAGAL_EFFECT"
      intentCode: "S2-1"
      condition: "#operation_status == 'done'"
      event: "S2-1_done"
      action: "actionLogTransition"
      description: "迷走神经刺激已完成"

    # ★ 新增系统超时规则：30秒无响应自动进入超时处理
    - source: "DO_VAGAL_MANEUVER"
      target: "TIMEOUT_HANDLING"
      intentCode: "SYS_TIMEOUT_VAGAL"
      condition: "#elapsedSeconds >= 30"
      event: "SYS_TIMEOUT_VAGAL"
      action: "actionTimeoutWarn"
      systemTrigger: true
      description: "⏰迷走刺激30秒超时→进入延时处理"

    # === 评估迷走效果 ===
    - source: "ASSESS_VAGAL_EFFECT"
      target: "MONITOR_SINUS_RHYTHM"
      intentCode: "S2-8"
      condition: "#vagal_effect_observed == 'success'"
      event: "S2-8_success"
      action: "actionConversionSuccess"
      description: "✅迷走刺激成功→转复窦性"

    - source: "ASSESS_VAGAL_EFFECT"
      target: "DO_ADENOSINE_6MG"
      intentCode: "S2-8"
      condition: "#vagal_effect_observed == 'failure'"
      event: "S2-8_failure"
      action: "actionLogTransition"
      description: "❌迷走失败→准备腺苷6mg"

    # ★ 新增系统超时规则：评估迷走效果30秒无反馈，自动认为失败并推进
    - source: "ASSESS_VAGAL_EFFECT"
      target: "DO_ADENOSINE_6MG"
      intentCode: "SYS_VAGAL_EFFECT_TIMEOUT"
      condition: "#elapsedSeconds >= 30"
      event: "SYS_VAGAL_EFFECT_TIMEOUT"
      action: "actionLogTransition"
      systemTrigger: true
      description: "⏰迷走效果评估30秒超时→自动认为失败，推进腺苷6mg"

    # === 腺苷6mg ===
    - source: "DO_ADENOSINE_6MG"
      target: "ASSESS_6MG_EFFECT"
      intentCode: "S2-2"
      condition: "#operation_status == 'done'"
      event: "S2-2_done"
      action: "actionLogTransition"
      description: "腺苷6mg已推注"

    # === 评估6mg效果 ===
    - source: "ASSESS_6MG_EFFECT"
      target: "MONITOR_SINUS_RHYTHM"
      intentCode: "S2-8"
      condition: "#vagal_effect_observed == 'success'"
      event: "S2-8_success"
      action: "actionConversionSuccess"
      description: "✅腺苷6mg成功→转复窦性"

    - source: "ASSESS_6MG_EFFECT"
      target: "DO_ADENOSINE_12MG"
      intentCode: "S2-8"
      condition: "#vagal_effect_observed == 'failure'"
      event: "S2-8_failure"
      action: "actionLogTransition"
      description: "❌腺苷6mg失败→准备腺苷12mg"

    # ★ 新增系统超时规则：6mg效果评估60秒无反馈，自动推进12mg
    - source: "ASSESS_6MG_EFFECT"
      target: "DO_ADENOSINE_12MG"
      intentCode: "SYS_ADENOSINE_6MG_TIMEOUT"
      condition: "#elapsedSeconds >= 60"
      event: "SYS_ADENOSINE_6MG_TIMEOUT"
      action: "actionLogTransition"
      systemTrigger: true
      description: "⏰腺苷6mg效果评估60秒超时→自动推进12mg"

    # === 腺苷12mg ===
    - source: "DO_ADENOSINE_12MG"
      target: "ASSESS_12MG_EFFECT"
      intentCode: "S2-2"
      condition: "#operation_status == 'done'"
      event: "S2-2_done"
      action: "actionLogTransition"
      description: "腺苷12mg已推注"

    # === 评估12mg效果 ===
    - source: "ASSESS_12MG_EFFECT"
      target: "MONITOR_SINUS_RHYTHM"
      intentCode: "S2-8"
      condition: "#vagal_effect_observed == 'success'"
      event: "S2-8_success"
      action: "actionConversionSuccess"
      description: "✅腺苷12mg成功→转复窦性"

    - source: "ASSESS_12MG_EFFECT"
      target: "DO_SECOND_LINE_DRUG"
      intentCode: "S2-8"
      condition: "#vagal_effect_observed == 'failure'"
      event: "S2-8_failure"
      action: "actionLogTransition"
      description: "❌腺苷12mg失败→准备二线药物"

    # ★ 新增系统超时规则：12mg效果评估60秒无反馈，自动推进二线药物
    - source: "ASSESS_12MG_EFFECT"
      target: "DO_SECOND_LINE_DRUG"
      intentCode: "SYS_ADENOSINE_12MG_TIMEOUT"
      condition: "#elapsedSeconds >= 60"
      event: "SYS_ADENOSINE_12MG_TIMEOUT"
      action: "actionLogTransition"
      systemTrigger: true
      description: "⏰腺苷12mg效果评估60秒超时→自动推进二线药物"

    # === 二线药物 ===
    - source: "DO_SECOND_LINE_DRUG"
      target: "ASSESS_SECOND_EFFECT"
      intentCode: "S2-5"
      condition: "#operation_status == 'done'"
      event: "S2-5_done"
      action: "actionLogTransition"
      description: "二线药物已执行"

    # === 评估二线药物效果 ===
    - source: "ASSESS_SECOND_EFFECT"
      target: "MONITOR_SINUS_RHYTHM"
      intentCode: "S2-8"
      condition: "#vagal_effect_observed == 'success'"
      event: "S2-8_success"
      action: "actionConversionSuccess"
      description: "✅二线药物成功→转复窦性"

    - source: "ASSESS_SECOND_EFFECT"
      target: "EXPERT_CONSULTATION"
      intentCode: "S2-8"
      condition: "#vagal_effect_observed == 'failure'"
      event: "S2-8_failure"
      action: "actionLogTransition"
      description: "❌二线药物失败→专家会诊"

    # ★ 新增系统超时规则：二线药物效果评估60秒无反馈，自动推进专家会诊
    - source: "ASSESS_SECOND_EFFECT"
      target: "EXPERT_CONSULTATION"
      intentCode: "SYS_SECOND_LINE_TIMEOUT"
      condition: "#elapsedSeconds >= 60"
      event: "SYS_SECOND_LINE_TIMEOUT"
      action: "actionLogTransition"
      systemTrigger: true
      description: "⏰二线药物效果评估60秒超时→自动推进专家会诊"

    # === 稳定状态下电复律路径 ===
    - source: "DO_SECOND_LINE_DRUG"
      target: "STABLE_CARDIOVERSION"
      intentCode: "S2-6"
      condition: "true"
      event: "S2-6_stable_choice"
      action: "actionStartCardioversion"
      description: "稳定状态下选择电复律（药物后）"

    - source: "ASSESS_SECOND_EFFECT"
      target: "STABLE_CARDIOVERSION"
      intentCode: "S2-6"
      condition: "true"
      event: "S2-6_stable_choice"
      action: "actionStartCardioversion"
      description: "二线药物失败后选择电复律"

    # === 专家会诊状态 ===
    - source: "EXPERT_CONSULTATION"
      target: "STABLE_CARDIOVERSION"
      intentCode: "S2-6"
      condition: "true"
      event: "expert_advise_cardioversion"
      action: "actionStartCardioversion"
      description: "会诊建议电复律"

    - source: "EXPERT_CONSULTATION"
      target: "TERMINAL_END"
      event: "SYS_TRANSFER"
      action: "actionTerminate"
      description: "会诊决定转上级医院，案例结束"

    # === 稳定电复律状态 ===
    - source: "STABLE_CARDIOVERSION"
      target: "MONITOR_SINUS_RHYTHM"
      intentCode: "S2-8"
      condition: "#vagal_effect_observed == 'success'"
      event: "S2-8_success"
      action: "actionConversionSuccess"
      description: "✅稳定电复律成功→转复窦性"

    - source: "STABLE_CARDIOVERSION"
      target: "STABLE_CARDIOVERSION"
      intentCode: "S2-8"
      condition: "#vagal_effect_observed == 'failure'"
      event: "S2-8_failure"
      action: "actionRepeatCardioversion"
      description: "❌稳定电复律失败→可再次电击或会诊"

    - source: "STABLE_CARDIOVERSION"
      target: "EXPERT_CONSULTATION"
      intentCode: "S2-8"
      condition: "#vagal_effect_observed == 'failure'"
      event: "S2-8_failure_consult"
      action: "actionLogTransition"
      description: "稳定电复律失败→转专家会诊"

    # === 不稳定/电复律 ===
    - source: "UNSTABLE_CARDIOVERSION"
      target: "UNSTABLE_CARDIOVERSION"
      intentCode: "S2-6"
      condition: "#operation_status == 'start'"
      event: "S2-6_start"
      action: "actionStartCardioversion"
      description: "开始准备电复律"

    - source: "UNSTABLE_CARDIOVERSION"
      target: "UNSTABLE_CARDIOVERSION"
      intentCode: "G1-1"
      condition: "true"
      event: "clear_done"
      action: "actionLogClear"
      description: "清场完成，可进行放电"

    - source: "UNSTABLE_CARDIOVERSION"
      target: "MONITOR_SINUS_RHYTHM"
      intentCode: "S2-8"
      condition: "#vagal_effect_observed == 'success'"
      event: "S2-8_success"
      action: "actionConversionSuccess"
      description: "✅电复律成功→转复窦性"

    - source: "UNSTABLE_CARDIOVERSION"
      target: "UNSTABLE_CARDIOVERSION"
      intentCode: "S2-8"
      condition: "#vagal_effect_observed == 'failure'"
      event: "S2-8_failure"
      action: "actionRepeatCardioversion"
      description: "❌电复律失败→重复电击"

    # === 错误处理 ===
    - source: "ERROR_HANDLING"
      target: "ASSESS_STABILITY"
      event: "SYS_ERROR_FIXED"
      action: "actionLogTransition"
      description: "错误已纠正→返回稳定性评估"

    - source: "ERROR_HANDLING"
      target: "DO_VAGAL_MANEUVER"
      event: "SYS_ERROR_FIXED_VAGAL"
      action: "actionLogTransition"
      description: "补做迷走→返回迷走操作"

    - source: "ERROR_HANDLING"
      target: "DO_ADENOSINE_6MG"
      event: "SYS_ERROR_FIXED_DOSE"
      action: "actionLogTransition"
      description: "纠正剂量→重新给药6mg"

    # === 延时处理 ===
    - source: "TIMEOUT_HANDLING"
      target: "ASSESS_STABILITY"
      event: "SYS_TIMEOUT_CONTINUE"
      action: "actionTimeoutResume"
      description: "学员继续→返回评估"

    - source: "TIMEOUT_HANDLING"
      target: "DO_ADENOSINE_6MG"
      event: "SYS_TIMEOUT_NEXT"
      action: "actionTimeoutDefaultNext"
      description: "⏰超时自动→推进至腺苷6mg"

    # === 终止状态 ===
    - source: "MONITOR_SINUS_RHYTHM"
      target: "TERMINAL_END"
      event: "SYS_TERMINATE"
      action: "actionTerminate"
      description: "✅完成救治→终止"
