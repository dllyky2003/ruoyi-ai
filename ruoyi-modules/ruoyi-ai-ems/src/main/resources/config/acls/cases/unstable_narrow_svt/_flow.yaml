# ============================================================
# 子级流程：unstable_narrow_svt（不稳定窄QRS心动过速 / 紧急同步电复律）
# 案例编号：102  |  父级：GLOBAL  |  版本：1.1.1
# 参考：2025 AHA 心动过速伴脉搏算法
# 修订：1.1.0（★ 修复 ROSC 衔接：在 F-102-MONITOR_SINUS_RHYTHM 增加直连
#                F-000-ROSC_MANAGEMENT 的转移，并显式置位 clinical.rosc /
#                process.returnToParent，确保转复窦性后父级 ROSC 接管）
# 修订：1.1.1（★ 修复 ROSC 卡死：在 F-102-MONITOR_SINUS_RHYTHM 出边 effects 中
#                增加 clinical.roscStabilized = true，避免 F-000-ROSC_MANAGEMENT
#                因 roscStabilized 未被置位而无法推进到 F-000-POST_ROSC_CARE）
# 修订：1.1.2（★ 快照 ACLS-TUTOR-SNAPSHOT-20260923-10 方案B：
#                删除 stateMachine.initial 覆写，改为注释保留。
#                原因：initial 写死 F-102-CHECK_QRS_WIDTH 使会话绕过
#                F-000-SCENE_START → ... → F-000-INITIAL_SETUP 完整链，
#                导致 state_physiology 基线未推送、phys.rhythm 从未写入、
#                EvolutionRuleEvaluator 的 rhythm:"svt" 规则静默跳过。
#                删除后由本文件 priority 26 的入口转移
#                （source=F-000-INITIAL_SETUP, condition=#derived.isUnstableNarrowQrs == true）
#                在父级链路末端接管，进入 F-102-CHECK_QRS_WIDTH。
#                对照 stable_narrow/_flow.yaml：该文件无 initial 字段，故能走完整链。）
# 修订：1.1.3（★ P2-17：F-102-DETERIORATION 增加意图出边，
#                避免恶化后所有学员操作被"无匹配转移"全部拒绝形成死胡同。
#                原条件边（intentCode=null, priority=10）保留不动。）
# ============================================================
caseId: "unstable_narrow_svt"
caseName: "不稳定窄QRS心动过速（紧急同步电复律）"
version: "1.1.1"
parent: "GLOBAL"
description: "不稳定窄QRS规则节律心动过速 → 同步电复律全流程"

stateDescriptions:
  F-102-CHECK_QRS_WIDTH: "📐 QRS 宽度判读"
  F-102-CONFIRM_UNSTABLE: "⚠️ 确认血流动力学不稳定"
  F-102-PREP_CARDIOVERSION: "⚡ 电复律准备（SYNC/能量/镇静/充电/清场）"
  F-102-DELIVER_SHOCK: "⚡ 执行同步放电"
  F-102-POST_SHOCK_ASSESS: "📊 复律后心律评估"
  F-102-MONITOR_SINUS_RHYTHM: "📊 窦性心律监测"
  F-102-SECOND_SHOCK_PREP: "⚡ 二次电复律准备"
  F-102-DETERIORATION: "🚨 病情恶化（PEA/停搏）"
  F-102-EXIT_TO_PARENT: "🚪 退出到父级"

stateMachine:
  # ★ 方案B（快照 ACLS-TUTOR-SNAPSHOT-20260923-10）：
  #   删除 initial 覆写，让会话走 GLOBAL 默认入口链
  #   F-000-SCENE_START → BLS_PRIMARY_SURVEY → INITIAL_ASSESSMENT → INITIAL_SETUP，
  #   再由本文件 priority 26 的入口转移（condition=#derived.isUnstableNarrowQrs == true）
  #   进入 F-102-CHECK_QRS_WIDTH。
  #   对照 stable_narrow/_flow.yaml：该文件无 initial 字段，故能走完整链。
  # initial: "F-102-CHECK_QRS_WIDTH"
  states:
    - F-102-CHECK_QRS_WIDTH
    - F-102-CONFIRM_UNSTABLE
    - F-102-PREP_CARDIOVERSION
    - F-102-DELIVER_SHOCK
    - F-102-POST_SHOCK_ASSESS
    - F-102-MONITOR_SINUS_RHYTHM
    - F-102-SECOND_SHOCK_PREP
    - F-102-DETERIORATION
    - F-102-EXIT_TO_PARENT

  endStates:
    - F-102-EXIT_TO_PARENT

  # ==========================================================
  # Phase SM：顶层叶子阶段
  # ==========================================================
  phases:
    - id: "UNSTABLE_NARROW_PATH"
      displayName: "不稳定窄QRS电复律路径"
      priority: 96
      states:
        - F-102-CHECK_QRS_WIDTH
        - F-102-CONFIRM_UNSTABLE
        - F-102-PREP_CARDIOVERSION
        - F-102-DELIVER_SHOCK
        - F-102-POST_SHOCK_ASSESS
        - F-102-MONITOR_SINUS_RHYTHM
        - F-102-SECOND_SHOCK_PREP
        - F-102-DETERIORATION
      entryCondition: "#derived.isUnstableNarrowQrs == true"
      allowedIntents:
        - S-102-1-1
        - S-102-1-2
        - S-102-2-1
        - S-102-2-2
        - S-102-2-3
        - S-102-2-4
        - S-102-2-5
        - S-102-2-6
        - S-102-2-7
        - S-102-2-8
        - IA_010_check_heart_rate
        - IA_011_check_oxygen_saturation
        - IA_040_turn_on_ecg
        - IA_041_connect_leads_to_ecg
        - IA_043_obtain_ecg_recording
        - IA_044_interpret_and_report
        - IA_050_request_aed
        - IA_051_request_assistance
      requiresPhases:
        - SETUP
      lock:
        enabled: false

  transitions:
    # ==========================================================
    # 0. 父级入口（priority 26 > GLOBAL 的 25，优先命中本病例）
    # ==========================================================
    - source: "F-000-INITIAL_SETUP"
      target: "F-102-CHECK_QRS_WIDTH"
      intentCode: null
      condition: "#derived.isUnstableNarrowQrs == true"
      priority: 26
      exitReason: null
      effects: []
      description: "不稳定窄QRS心动过速 → 进入电复律子级"

    # ==========================================================
    # 1. QRS 宽度判读
    # ==========================================================
    - source: "F-102-CHECK_QRS_WIDTH"
      target: "F-102-CONFIRM_UNSTABLE"
      intentCode: "S-102-1-1"
      condition: "#derived.qrsWidth == 'narrow'"
      priority: 10
      exitReason: null
      effects: []
      description: "确认窄QRS → 进入不稳定确认"

    - source: "F-102-CHECK_QRS_WIDTH"
      target: "F-102-EXIT_TO_PARENT"
      intentCode: "S-102-1-1"
      condition: "#derived.qrsWidth == 'wide'"
      priority: 100
      exitReason: "WIDE_QRS"
      effects: []
      description: "QRS 为宽 → 退出父级重新分类"

    # ==========================================================
    # 2. 确认不稳定
    # ==========================================================
    - source: "F-102-CONFIRM_UNSTABLE"
      target: "F-102-PREP_CARDIOVERSION"
      intentCode: "S-102-1-2"
      condition: "#derived.unstable == true"
      priority: 10
      exitReason: null
      effects:
        - var: "process.instabilityTriggered"
          value: true
      description: "确认不稳定 → 进入电复律准备"

    - source: "F-102-CONFIRM_UNSTABLE"
      target: "F-102-EXIT_TO_PARENT"
      intentCode: "S-102-1-2"
      condition: "#derived.stable == true"
      priority: 100
      exitReason: "STABLE_REASSESS"
      effects: []
      description: "实际稳定 → 退出父级走稳定路径"

    # ==========================================================
    # 3. 电复律准备（SYNC → 能量 → 镇静 → 充电 → 清场）
    # 每个子步骤在同一状态自循环，累积设备状态
    # ==========================================================
    # ==========================================================
    # 3. 电复律准备（SYNC → 能量 → 镇静 → 充电 → 清场）
    #    Guard 判"步骤标记变量"——恢复事前语义：
    #      没做过 → stepXxx == false → Guard 通过
    #      做过   → stepXxx == true  → Guard 失败（防止重复触发）
    #    设备真实变量由技能自己的 outputs 维护，与本层 Guard 解耦。
    # ==========================================================
    - source: "F-102-PREP_CARDIOVERSION"
      target: "F-102-PREP_CARDIOVERSION"
      intentCode: "S-102-2-1"
      condition: "#process.stepSyncModeRequested == false"
      priority: 10
      exitReason: null
      effects:
        - var: "process.stepSyncModeRequested"
          value: true
        - var: "process.lastInterventionTime"
          valueExpression: "T(System).currentTimeMillis()"
      description: "开启 SYNC 模式（事前断言：尚未请求）"

    - source: "F-102-PREP_CARDIOVERSION"
      target: "F-102-PREP_CARDIOVERSION"
      intentCode: "S-102-2-2"
      condition: "#process.stepEnergySelected == false"
      priority: 11
      exitReason: null
      effects:
        - var: "process.stepEnergySelected"
          value: true
        - var: "process.lastInterventionTime"
          valueExpression: "T(System).currentTimeMillis()"
      description: "选择能量（事前断言：尚未选择）"

    - source: "F-102-PREP_CARDIOVERSION"
      target: "F-102-PREP_CARDIOVERSION"
      intentCode: "S-102-2-3"
      condition: "#process.stepSedationGiven == false"
      priority: 12
      exitReason: null
      effects:
        - var: "process.stepSedationGiven"
          value: true
        - var: "process.lastInterventionTime"
          valueExpression: "T(System).currentTimeMillis()"
      description: "给予镇静（事前断言：尚未给药）"

    - source: "F-102-PREP_CARDIOVERSION"
      target: "F-102-PREP_CARDIOVERSION"
      intentCode: "S-102-2-4"
      condition: "#process.stepDefibCharged == false"
      priority: 13
      exitReason: null
      effects:
        - var: "process.stepDefibCharged"
          value: true
        - var: "process.lastInterventionTime"
          valueExpression: "T(System).currentTimeMillis()"
      description: "充电（事前断言：尚未充电）"

    - source: "F-102-PREP_CARDIOVERSION"
      target: "F-102-PREP_CARDIOVERSION"
      intentCode: "S-102-2-5"
      condition: "#process.stepClearAnnounced == false"
      priority: 14
      exitReason: null
      effects:
        - var: "process.stepClearAnnounced"
          value: true
      description: "清场（事前断言：尚未宣布清场）"

    # ★ S-102-2-6 放电：保持用真实设备/临床变量（临床底线，不能用标记变量）
    - source: "F-102-PREP_CARDIOVERSION"
      target: "F-102-DELIVER_SHOCK"
      intentCode: "S-102-2-6"
      condition: "#derived.cardioversionReady == true && #intervention.sedation.given == true && #process.allClearForShock == true"
      priority: 20
      exitReason: null
      effects: [ ]
      description: "设备就绪 + 镇静 + 清场 → 进入放电（真实状态校验）"

    # ==========================================================
    # 4. 执行放电
    # ==========================================================
    - source: "F-102-DELIVER_SHOCK"
      target: "F-102-DELIVER_SHOCK"
      intentCode: "S-102-2-6"
      condition: "#intervention.cardioversion.success == false && (#intervention.cardioversion.count == null || #intervention.cardioversion.count < 3)"
      priority: 15
      exitReason: null
      effects:
        - var: "intervention.cardioversion.count"
          valueExpression: "(intervention.cardioversion.count == null ? 1 : intervention.cardioversion.count + 1)"
        - var: "intervention.cardioversion.lastEnergy"
          value: 100
        - var: "process.lastInterventionTime"
          valueExpression: "T(System).currentTimeMillis()"
      description: "执行同步放电，记录次数与能量"

    - source: "F-102-DELIVER_SHOCK"
      target: "F-102-POST_SHOCK_ASSESS"
      intentCode: "S-102-2-7"
      condition: "#intervention.cardioversion.count != null"
      priority: 20
      exitReason: null
      effects: []
      description: "放电完成 → 立即进行复律后心律评估"

    - source: "F-102-DELIVER_SHOCK"
      target: "F-102-EXIT_TO_PARENT"
      intentCode: null
      condition: "#intervention.cardioversion.success == false && #intervention.cardioversion.count >= 3"
      priority: 100
      exitReason: "REFRACTORY_SHOCK"
      effects: []
      description: "3 次电复律失败 → 退出父级"

    # ==========================================================
    # 5. 复律后心律评估
    # ==========================================================
    # ★ 修改点 1/2：intentCode "S-102-2-8" → null
    #    让 isSinusRhythm == true 成立时自动推进到监测状态，
    #    避免学员需要重复说一次 S-102-2-8 才能继续。
    - source: "F-102-POST_SHOCK_ASSESS"
      target: "F-102-MONITOR_SINUS_RHYTHM"
      intentCode: null
      condition: "#derived.isSinusRhythm == true"
      priority: 10
      exitReason: null
      effects:
        - var: "intervention.rhythmConverted"
          value: true
      description: "转复为窦性 → 进入窦性监测"

    - source: "F-102-POST_SHOCK_ASSESS"
      target: "F-102-SECOND_SHOCK_PREP"
      intentCode: "S-102-2-8"
      condition: "#derived.isSinusRhythm == false && (#intervention.cardioversion.count == null || #intervention.cardioversion.count < 3)"
      priority: 15
      exitReason: null
      effects: []
      description: "未转复 → 准备二次电复律"

    - source: "F-102-POST_SHOCK_ASSESS"
      target: "F-102-EXIT_TO_PARENT"
      intentCode: "S-102-2-8"
      condition: "#derived.isSinusRhythm == false && #intervention.cardioversion.count >= 3"
      priority: 100
      exitReason: "REFRACTORY_SHOCK"
      effects: []
      description: "3 次后仍未转复 → 退出父级"

    # ==========================================================
    # 6. 二次电复律准备（能量阶梯：100J → 150J → 200J）
    # ==========================================================
    - source: "F-102-SECOND_SHOCK_PREP"
      target: "F-102-DELIVER_SHOCK"
      intentCode: "S-102-2-2"
      condition: "#device.defibEnergy != null && #device.defibEnergy < 200"
      priority: 10
      exitReason: null
      effects:
        - var: "device.defibEnergy"
          valueExpression: "(device.defibEnergy == null ? 150 : Math.min(device.defibEnergy + 50, 200))"
        - var: "device.defibCharged"
          value: false
        - var: "process.allClearForShock"
          value: false
        - var: "process.lastInterventionTime"
          valueExpression: "T(System).currentTimeMillis()"
      description: "能量阶梯上调 50J，重置充电与清场标记 → 回到放电状态"

    # ==========================================================
    # 7. 窦性监测
    # ==========================================================
    # ★ 修复 ROSC 衔接（1.1.0）：
    #    1) 新增直连 F-000-ROSC_MANAGEMENT 的转移，priority 100 最高，
    #       并显式置位 clinical.rosc = true / process.returnToParent = "ROSC"。
    #    2) 保留原 EXIT_TO_PARENT 路径作为备选，但同样置位关键变量，
    #       并降低优先级（10）以确保直连优先。
    # ★ 修复 ROSC 卡死（1.1.1）：
    #    3) 两条出边 effects 均增加 clinical.roscStabilized = true。
    #       语义：转复窦性 + 状态生理基线已稳定 → 判定为"ROSC 已稳定"。
    #       原因：F-000-ROSC_MANAGEMENT 的唯一出边 Guard 是
    #             #clinical.roscStabilized == true，若无人写入该变量，
    #             状态机会永久卡死并拒绝所有学员意图。
    # ==========================================================
    - source: "F-102-MONITOR_SINUS_RHYTHM"
      target: "F-000-ROSC_MANAGEMENT"
      intentCode: null
      condition: "#derived.isSinusRhythm == true"
      priority: 100
      exitReason: "ROSC"
      effects:
        - var: "clinical.rosc"
          value: true
        - var: "clinical.roscStabilized"       # ★ 1.1.1 新增
          value: true
        - var: "process.returnToParent"
          value: "ROSC"
      description: "窦性稳定 → 直接进入父级 ROSC 管理（已确认稳定）"

    - source: "F-102-MONITOR_SINUS_RHYTHM"
      target: "F-102-EXIT_TO_PARENT"
      intentCode: null
      condition: "#derived.isSinusRhythm == true"
      priority: 10
      exitReason: "ROSC"
      effects:
        - var: "clinical.rosc"
          value: true
        - var: "clinical.roscStabilized"       # ★ 1.1.1 新增
          value: true
        - var: "process.returnToParent"
          value: "ROSC"
      description: "窦性稳定 → 经 EXIT_TO_PARENT 退出（备选路径，已确认稳定）"

    - source: "F-102-MONITOR_SINUS_RHYTHM"
      target: "F-102-DETERIORATION"
      intentCode: null
      condition: "#phys.systolicBp < 90 && #derived.isSinusRhythm == false"
      priority: 50
      exitReason: null
      effects: []
      description: "监测期间再次恶化 → 恶化处理"

    # ==========================================================
    # 8. 病情恶化（PEA/停搏）
    # ==========================================================
    - source: "F-102-DETERIORATION"
      target: "F-102-EXIT_TO_PARENT"
      intentCode: null
      condition: "#process.returnToParent != null"
      priority: 10
      exitReason: null
      effects: []
      description: "恶化处理完成 → 退出父级 CPR 接管"

    # ----------------------------------------------------------
    # ★ P2-17：F-102-DETERIORATION 意图出边
    # 让学员进入恶化状态后不再被"无匹配转移"全部拒绝。
    # 原有条件边（intentCode=null, priority=10）保持不动，继续作
    # 为 returnToParent 写完后的最终出口。
    # ----------------------------------------------------------

    # 1) 关键脱困：恶化状态下立即放电 → 回不稳定确认，重新走复律准备
    - source: "F-102-DETERIORATION"
      target: "F-102-CONFIRM_UNSTABLE"
      intentCode: "S-102-2-6"
      condition: null
      priority: 20
      exitReason: null
      effects:
        - var: "process.deteriorationResolved"
          value: true
        - var: "process.lastInterventionTime"
          valueExpression: "T(System).currentTimeMillis()"
      description: "恶化中放电成功 → 回到不稳定确认，重新准备复律"

    # 2) 复律前准备动作，允许在恶化状态下推进
    - source: "F-102-DETERIORATION"
      target: "F-102-PREP_CARDIOVERSION"
      intentCode: "S-102-2-1"
      condition: null
      priority: 30
      exitReason: null
      effects: []
      description: "恶化中开启 SYNC → 回到复律准备"

    - source: "F-102-DETERIORATION"
      target: "F-102-PREP_CARDIOVERSION"
      intentCode: "S-102-2-2"
      condition: null
      priority: 31
      exitReason: null
      effects: []
      description: "恶化中选择能量 → 回到复律准备"

    - source: "F-102-DETERIORATION"
      target: "F-102-PREP_CARDIOVERSION"
      intentCode: "S-102-2-3"
      condition: null
      priority: 32
      exitReason: null
      effects: []
      description: "恶化中给予镇静 → 回到复律准备"

    - source: "F-102-DETERIORATION"
      target: "F-102-PREP_CARDIOVERSION"
      intentCode: "S-102-2-4"
      condition: null
      priority: 33
      exitReason: null
      effects: []
      description: "恶化中充电 → 回到复律准备"

    - source: "F-102-DETERIORATION"
      target: "F-102-PREP_CARDIOVERSION"
      intentCode: "S-102-2-5"
      condition: null
      priority: 34
      exitReason: null
      effects: []
      description: "恶化中清场 → 回到复律准备"

    - source: "F-102-DETERIORATION"
      target: "F-102-PREP_CARDIOVERSION"
      intentCode: "S-102-2-7"
      condition: null
      priority: 40
      exitReason: null
      effects: []
      description: "恶化中复律后评估 → 回到复律准备"

    # 3) 观察类意图就地自循环，避免被拒绝路径吞掉
    - source: "F-102-DETERIORATION"
      target: "F-102-DETERIORATION"
      intentCode: "IA_001_approach_patient"
      condition: null
      priority: 90
      exitReason: null
      effects: []
      description: "恶化中靠近患者 → 就地观察"

    - source: "F-102-DETERIORATION"
      target: "F-102-DETERIORATION"
      intentCode: "IA_009_check_blood_pressure"
      condition: null
      priority: 90
      exitReason: null
      effects: []
      description: "恶化中测血压 → 就地观察"

    - source: "F-102-DETERIORATION"
      target: "F-102-DETERIORATION"
      intentCode: "IA_017_check_ao"
      condition: null
      priority: 90
      exitReason: null
      effects: []
      description: "恶化中评估意识 → 就地观察"

    - source: "F-102-DETERIORATION"
      target: "F-102-DETERIORATION"
      intentCode: "IA_010_check_heart_rate"
      condition: null
      priority: 91
      exitReason: null
      effects: []
      description: "恶化中查心率 → 就地观察"

    - source: "F-102-DETERIORATION"
      target: "F-102-DETERIORATION"
      intentCode: "IA_011_check_oxygen_saturation"
      condition: null
      priority: 92
      exitReason: null
      effects: []
      description: "恶化中查血氧 → 就地观察"

    # ==========================================================
    # 9. 退出
    # ==========================================================
    - source: "F-102-EXIT_TO_PARENT"
      target: "F-000-ROSC_MANAGEMENT"
      intentCode: null
      condition: "#process.returnToParent == 'ROSC'"
      priority: 100
      exitReason: null
      effects: []
      description: "复律成功 → 父级 ROSC 接管"

    - source: "F-102-EXIT_TO_PARENT"
      target: "F-000-INITIAL_SETUP"
