# 7. 派生变量计算规则（进入每个状态时执行）
onEnterRules:
  F-101-ASSESS_STABILITY:
    - "#derivedStable = (#systolicBp >= 90 && #consciousness == 'alert' && #respiratoryRate >= 10 && #respiratoryRate <= 30)"
    - "#derivedQrsWidth = (#qrsDuration <= 0.12) ? 'narrow' : 'wide'"
    - "#derivedRhythmRegular = (#rrIntervalJitter < 0.12)"
  F-101-CHECK_QRS_WIDTH:
    - "#derivedQrsWidth = (#qrsDuration <= 0.12) ? 'narrow' : 'wide'"
  F-101-CHECK_RHYTHM:
    - "#derivedRhythmRegular = (#rrIntervalJitter < 0.12)"
  # 其他状态无需派生计算，留空列表（生产环境中，引擎会检查并跳过空列表）

