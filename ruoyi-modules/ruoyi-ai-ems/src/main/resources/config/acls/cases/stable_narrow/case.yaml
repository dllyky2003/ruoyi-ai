    category: PROCESS_MARKER
    source: EXECUTOR
    writable_by: EXECUTOR
    default_value: false
    persistence: true
    scoring: false

  - name: lastInterventionTime
    name_cn: "上次干预时间"
    type: long
    unit: timestamp
    description: "最后一次干预的时间戳"
    category: SYSTEM
    source: SYSTEM
    writable_by: SYSTEM
    default_value: null
    persistence: true
