# ============================================================
# 子级流程：stable_narrow（窄QRS稳定心动过速 / SVT路径）
# 案例编号：101  |  父级：GLOBAL  |  版本：1.0.0
# 参考：2025 AHA 心动过速伴脉搏算法
# ============================================================
caseId: "stable_narrow"
caseName: "窄QRS稳定心动过速（SVT）"
version: "1.0.0"
parent: "GLOBAL"
description: "迷走→腺苷阶梯→监测/升级"

# 状态描述（UI展示）
stateDescriptions:
  F-101-ASSESS_STABILITY: "📋 进入校验（确认稳定+窄QRS）"
  F-101-CHECK_QRS_WIDTH: "📐 QRS宽度确认"
  F-101-CHECK_RHYTHM: "🔄 节律类型确认（规则性）"
  F-101-DO_VAGAL_MANEUVER: "💆 迷走神经刺激（一线）"
  F-101-DO_ADENOSINE_6MG: "💉 腺苷 6mg IV（二线）"
  F-101-DO_ADENOSINE_12MG: "💉 腺苷 12mg IV（三线）"
  F-101-DO_SECOND_LINE_DRUG: "💊 二线药物（β受体阻滞剂/CCB）"
  F-101-MONITOR_SINUS_RHYTHM: "📊 监测窦性心律（60s窗口）"
  F-101-UNSTABLE_CARDIOVERSION: "⚡ 同步电复律（紧急干预）"
  F-101-EXIT_TO_PARENT: "🚪 退出到父级"

# ============================================================
# ★ 核心状态机（标准集中式结构，确保加载器兼容）
# ============================================================
stateMachine:
  initial: "F-101-ASSESS_STABILITY"
  states:
    - F-101-ASSESS_STABILITY
    - F-101-CHECK_QRS_WIDTH
    - F-101-CHECK_RHYTHM
    - F-101-DO_VAGAL_MANEUVER
    - F-101-DO_ADENOSINE_6MG
    - F-101-DO_ADENOSINE_12MG
    - F-101-DO_SECOND_LINE_DRUG
    - F-101-MONITOR_SINUS_RHYTHM
    - F-101-UNSTABLE_CARDIOVERSION
    - F-101-EXIT_TO_PARENT
  endStates:
    - F-101-EXIT_TO_PARENT

  transitions:
    # ==========================================================
    # 层级1：进入校验
    # ==========================================================
    - source: "F-101-ASSESS_STABILITY"
      target: "F-101-CHECK_QRS_WIDTH"
      condition: "#derivedStable == true && #derivedQrsWidth == 'narrow'"
      priority: 10
      description: "进入校验通过 → 继续"
    - source: "F-101-ASSESS_STABILITY"
      target: "F-101-EXIT_TO_PARENT"
      condition: "#derivedStable == false"
      priority: 100
      description: "进入后发现不稳定 → 退出到父级"
      action: "#returnToParent = 'UNSTABLE'"

    # ==========================================================
    # 层级2：QRS宽度确认
    # ==========================================================
    - source: "F-101-CHECK_QRS_WIDTH"
      target: "F-101-CHECK_RHYTHM"
      condition: "#derivedQrsWidth == 'narrow'"
      priority: 10
      description: "QRS宽度确认通过 → 继续"
    - source: "F-101-CHECK_QRS_WIDTH"
      target: "F-101-EXIT_TO_PARENT"
      condition: "#derivedQrsWidth == 'wide'"
      priority: 100
      description: "QRS变为宽 → 退出到父级重新分类"
      action: "#returnToParent = 'WIDE_QRS'"

    # ==========================================================
    # 层级3：节律类型确认
    # ==========================================================
    - source: "F-101-CHECK_RHYTHM"
      target: "F-101-DO_VAGAL_MANEUVER"
      condition: "#derivedRhythmRegular == true"
      priority: 10
      description: "规则节律 → 进入迷走神经刺激"
    - source: "F-101-CHECK_RHYTHM"
      target: "F-101-EXIT_TO_PARENT"
      condition: "#derivedRhythmRegular == false"
      priority: 100
      description: "不规则节律（考虑AFib/AFlutter）→ 退出父级"
      action: "#returnToParent = 'IRREGULAR_RHYTHM'"

    # ==========================================================
    # 层级4：迷走神经刺激
    # ==========================================================
    - source: "F-101-DO_VAGAL_MANEUVER"
      target: "F-101-DO_ADENOSINE_6MG"
      condition: "#vagalEffectObserved == 'failure' && #adenosineDoseCount == 0"
      priority: 25
      description: "迷走刺激无效 → 腺苷 6mg"
      action: "#adenosineDoseCount = 1"
    - source: "F-101-DO_VAGAL_MANEUVER"
      target: "F-101-MONITOR_SINUS_RHYTHM"
      condition: "#vagalEffectObserved == 'success'"
      priority: 30
      description: "迷走刺激成功 → 监测窦性心律"
    - source: "F-101-DO_VAGAL_MANEUVER"
      target: "F-101-UNSTABLE_CARDIOVERSION"
      condition: "#isWpw == true"
      priority: 110
      description: "WPW预激 → 禁用腺苷，直接电复律"
      action: "#wpwAlertTriggered = true"
    - source: "F-101-DO_VAGAL_MANEUVER"
      target: "F-101-UNSTABLE_CARDIOVERSION"
      condition: "#systolicBp < 90 && #vagalAttempted == true"
      priority: 100
      description: "迷走刺激期间恶化 → 同步电复律"
      action: "#instabilityTriggered = true"

    # ==========================================================
    # 层级5：腺苷 6mg
    # ==========================================================
    - source: "F-101-DO_ADENOSINE_6MG"
      target: "F-101-DO_ADENOSINE_12MG"
      condition: "#rhythmConverted == false && #adenosineDoseCount == 1"
      priority: 20
      description: "6mg无效 → 腺苷 12mg"
      action: "#adenosineDoseCount = 2"
    - source: "F-101-DO_ADENOSINE_6MG"
      target: "F-101-MONITOR_SINUS_RHYTHM"
      condition: "#rhythmConverted == true"
      priority: 30
      description: "6mg有效 → 监测窦性心律"
    - source: "F-101-DO_ADENOSINE_6MG"
      target: "F-101-UNSTABLE_CARDIOVERSION"
      condition: "#systolicBp < 90"
      priority: 100
      description: "6mg期间恶化 → 同步电复律"
      action: "#instabilityTriggered = true"
    - source: "F-101-DO_ADENOSINE_6MG"
      target: "F-101-EXIT_TO_PARENT"
      condition: "#isWpw == true"
      priority: 100
      description: "WPW禁用腺苷 → 立即退出"
      action: "#returnToParent = 'WPW_CONTRADICTION'"

    # ==========================================================
    # 层级6：腺苷 12mg
    # ==========================================================
    - source: "F-101-DO_ADENOSINE_12MG"
      target: "F-101-DO_SECOND_LINE_DRUG"
      condition: "#rhythmConverted == false && #adenosineDoseCount >= 2"
      priority: 15
      description: "12mg无效 → 二线药物"
    - source: "F-101-DO_ADENOSINE_12MG"
      target: "F-101-MONITOR_SINUS_RHYTHM"
      condition: "#rhythmConverted == true"
      priority: 30
      description: "12mg有效 → 监测窦性心律"
    - source: "F-101-DO_ADENOSINE_12MG"
      target: "F-101-UNSTABLE_CARDIOVERSION"
      condition: "#systolicBp < 90"
      priority: 100
      description: "12mg期间恶化 → 同步电复律"

    # ==========================================================
    # 层级7：二线药物
    # ==========================================================
    - source: "F-101-DO_SECOND_LINE_DRUG"
      target: "F-101-MONITOR_SINUS_RHYTHM"
      condition: "#rhythmConverted == true"
      priority: 20
      description: "二线药物有效 → 监测窦性心律"
    - source: "F-101-DO_SECOND_LINE_DRUG"
      target: "F-101-EXIT_TO_PARENT"
      condition: "#rhythmConverted == false"
      priority: 10
      description: "二线药物无效 → 退出父级"
      action: "#returnToParent = 'REFRACTORY_SVT'"
      deviation: true
    - source: "F-101-DO_SECOND_LINE_DRUG"
      target: "F-101-UNSTABLE_CARDIOVERSION"
      condition: "#systolicBp < 90"
      priority: 100
      description: "二线期间恶化 → 同步电复律"

    # ==========================================================
    # 层级8：监测窦性心律转归
    # ==========================================================
    - source: "F-101-MONITOR_SINUS_RHYTHM"
      target: "F-101-EXIT_TO_PARENT"
      condition: "#derivedIsSinusRhythm == true"
      priority: 10
      description: "转为窦性 → 返回父级 ROSC 接管"
      action: "#returnToParent = 'ROSC'"
    - source: "F-101-MONITOR_SINUS_RHYTHM"
      target: "F-101-UNSTABLE_CARDIOVERSION"
      condition: "#systolicBp < 90"
      priority: 100
      description: "监测期间恶化 → 同步电复律"
    - source: "F-101-MONITOR_SINUS_RHYTHM"
      target: "F-101-EXIT_TO_PARENT"
      condition: "#timeElapsedSinceLastIntervention > 60 && #derivedIsSinusRhythm == false"
      priority: 5
      description: "60秒窗口未转复 → 返回父级"
      action: "#returnToParent = 'PERSISTENT_SVT'"
      deviation: true

    # ==========================================================
    # 层级9：同步电复律
    # ==========================================================
    - source: "F-101-UNSTABLE_CARDIOVERSION"
      target: "F-101-MONITOR_SINUS_RHYTHM"
      condition: "#cardioversionSuccess == true"
      priority: 20
      description: "电复律成功 → 监测窦性心律"
      action: "#cardioversionAttempts += 1"
    - source: "F-101-UNSTABLE_CARDIOVERSION"
      target: "F-101-UNSTABLE_CARDIOVERSION"
      condition: "#cardioversionSuccess == false && #cardioversionAttempts < 3"
      priority: 15
      description: "电复律失败且可重试 → 再次尝试"
      action: "#cardioversionAttempts += 1"
    - source: "F-101-UNSTABLE_CARDIOVERSION"
      target: "F-101-EXIT_TO_PARENT"
      condition: "#cardioversionSuccess == false && #cardioversionAttempts >= 3"
      priority: 10
      description: "多次电复律失败 → 退出父级"
      action: "#returnToParent = 'REFRACTORY_SHOCK'"
      deviation: true

# ============================================================
# ★ 生产级业务元数据（状态机引擎忽略，由业务层消费）
# ============================================================

# 1. 变量定义（来自 _variables.json，无删减）
variables:
  - name: cardioversionAttempts
    name_cn: "电复律尝试次数"
    type: integer
    min: 0
    max: 5
    description: "同步电复律尝试次数"
    category: PROCESS_MARKER
    source: STATE_MACHINE
    writable_by: STATE_MACHINE
    default_value: 0
    persistence: true
    scoring: false

  - name: adenosineDoseCount
    name_cn: "腺苷推注次数"
    type: integer
    min: 0
    max: 3
    description: "已推注腺苷次数（0=未推, 1=6mg已推, 2=12mg已推）"
    category: PROCESS_MARKER
    source: STATE_MACHINE
    writable_by: STATE_MACHINE
    default_value: 0
    persistence: true
    scoring: false

  - name: vagalAttempted
    name_cn: "已尝试迷走刺激"
    type: boolean
    description: "是否已尝试迷走神经刺激"
    category: PROCESS_MARKER
    source: STATE_MACHINE
    writable_by: STATE_MACHINE
    default_value: false
    persistence: true
    scoring: false

  - name: vagalEffectObserved
    name_cn: "迷走刺激效果"
    type: string
    enum:
      - value: success
        label: "成功"
      - value: failure
        label: "失败"
      - value: pending
        label: "待评估"
    description: "迷走刺激效果观察结果"
    category: LEARNER_STATEMENT
    source: LEARNER
    writable_by: CLASSIFIER
    default_value: pending
    persistence: true
    scoring: true

  - name: rhythmConverted
    name_cn: "心律转为窦性"
    type: boolean
    description: "经过治疗后心律是否转为窦性"
    category: CLINICAL
    source: SIMULATOR
    writable_by: SIMULATOR
    default_value: false
    persistence: true
    scoring: false

  - name: secondLineFailed
    name_cn: "二线药物无效"
    type: boolean
    description: "二线药物（β受体阻滞剂/CCB）是否无效"
    category: CLINICAL
    source: SIMULATOR
    writable_by: SIMULATOR
    default_value: false
    persistence: true
    scoring: false

  - name: returnToParent
    name_cn: "返回父级原因"
    type: string
    enum:
      - value: ROSC
        label: "转为窦性/ROSC"
      - value: UNSTABLE
        label: "不稳定"
      - value: WIDE_QRS
        label: "宽QRS"
      - value: IRREGULAR_RHYTHM
        label: "不规则节律"
      - value: REFRACTORY_SVT
        label: "难治性SVT"
      - value: PERSISTENT_SVT
        label: "持续性SVT（超时）"
      - value: REFRACTORY_SHOCK
        label: "难治性电复律"
      - value: WPW_CONTRADICTION
        label: "WPW禁忌"
    description: "子级返回父级的原因编码"
    category: SYSTEM
    source: STATE_MACHINE
    writable_by: STATE_MACHINE
    default_value: null
    persistence: true
    scoring: false

  - name: instabilityTriggered
    name_cn: "触发不稳定标志"
    type: boolean
    description: "是否触发了不稳定标志（用于紧急电复律）"
    category: PROCESS_MARKER
    source: STATE_MACHINE
    writable_by: STATE_MACHINE
    default_value: false
    persistence: true
    scoring: false

  - name: wpwAlertTriggered
    name_cn: "WPW警报触发"
    type: boolean
    description: "WPW警报是否已触发"
    category: PROCESS_MARKER
    source: STATE_MACHINE
    writable_by: STATE_MACHINE
    default_value: false
    persistence: true
    scoring: false

  - name: cardioversionSuccess
    name_cn: "电复律成功"
    type: boolean
    description: "电复律是否成功"
    category: CLINICAL
    source: SIMULATOR
    writable_by: SIMULATOR
    default_value: false
    persistence: true
    scoring: false

  - name: isWpw
    name_cn: "WPW患者"
    type: boolean
    description: "是否为WPW/预激综合征患者"
    category: CLINICAL
    source: SIMULATOR
    writable_by: SIMULATOR
    default_value: false
    persistence: true
    scoring: false

  - name: rhythmConfirmed
    name_cn: "确认的心律类型"
    type: string
    enum:
      - value: afib
        label: "房颤（AFib）"
      - value: aflutter
        label: "房扑（AFlutter）"
      - value: unknown
        label: "未知"
    description: "确认的心律类型"
    category: LEARNER_STATEMENT
    source: LEARNER
    writable_by: CLASSIFIER
    default_value: unknown
    persistence: true
    scoring: true

  - name: qrsWidthChecked
    name_cn: "QRS宽度已检查"
    type: boolean
    description: "QRS宽度是否已检查（稳定窄QRS场景）"
    category: PROCESS_MARKER
    source: EXECUTOR
    writable_by: EXECUTOR
    default_value: false
    persistence: true
    scoring: false

  - name: rhythmRegularityChecked
    name_cn: "节律规则性已检查"
    type: boolean
    description: "节律规则性是否已检查（稳定窄QRS场景）"
    category: PROCESS_MARKER
