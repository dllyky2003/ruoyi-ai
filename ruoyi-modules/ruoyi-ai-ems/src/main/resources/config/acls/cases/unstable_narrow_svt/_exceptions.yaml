# ============================================================
# unstable_narrow_svt（窄QRS不稳定心动过速）案例专属异常规则
# 案例编号：102
# 存放位置：cases/unstable_narrow_svt/_exceptions.yaml
# 父级：GLOBAL
#
# 本次修改（2026-09-22）：
#   DELAYED_FIRST_INTERVENTION:
#     - condition 增加 #process.timeoutOccurred != true，避免每轮指令反复命中。
#
# 命名规范说明：
#   unstable_narrow_svt 状态机真实状态名使用短横线（F-102-XXX），
#   与 stable_narrow 的下划线命名不同，以 _flow.yaml 与契约诊断日志为准。
#   因此本文件中的 jumpTo（F-102-PREP_CARDIOVERSION、F-102-DETERIORATION、
#   F-102-SECOND_SHOCK_PREP、F-102-POST_SHOCK_ASSESS）保持短横线，不做修改。
#   ⚠️ 若你后续确认 _flow.yaml 里用的是下划线，再统一切换命名规范。
# ============================================================

exceptions:

  # ============================================================
  # 规则 1：不稳定患者尝试迷走神经刺激 → 强制跳转电复律准备
  # ============================================================
  - id: "VAGAL_ON_UNSTABLE_NARROW"
    description: "血流动力学不稳定的窄QRS心动过速患者尝试迷走神经刺激。AHA 2025：不稳定患者应立即同步电复律，迷走神经刺激无效且延误抢救。"
    triggerIntent: "S-102-3-1"
    condition: |
      #derived.unstable == true
    severity: "CRITICAL"
    keepCurrent: false
    jumpTo: "F-102-PREP_CARDIOVERSION"
    unityStateName: "室上速(SVT)"
    effects:
      - var: "process.instabilityTriggered"
        value: true
    feedback:
      teaching:
        tts: "患者血流动力学不稳定，迷走神经刺激无效且会延误抢救。应立即同步电复律，不要浪费时间做 Valsalva。"
      learning:
        tts: "不稳定！跳过迷走神经刺激，直接同步电复律！"
        interruptCurrentTts: true
      exam:

  # ============================================================
  # 规则 2：不稳定患者尝试腺苷推注 → 强制跳转电复律准备
  # ============================================================
  - id: "ADENOSINE_ON_UNSTABLE_NARROW"
    description: "血流动力学不稳定的窄QRS心动过速患者尝试腺苷推注。AHA 2025：不稳定心动过速应立即同步电复律，腺苷可能加重低血压。"
    triggerIntent: "S-102-3-2"
    condition: |
      #derived.unstable == true
    severity: "CRITICAL"
    keepCurrent: false
    jumpTo: "F-102-PREP_CARDIOVERSION"
    unityStateName: "室上速(SVT)"
    effects:
      - var: "process.instabilityTriggered"
        value: true
    feedback:
      teaching:
        tts: "患者血流动力学不稳定，用药起效慢且腺苷可加重低血压。应立即同步电复律，这是 AHA 2025 的 I 类推荐。"
      learning:
        tts: "不稳定！跳过药物，直接同步电复律！"
        interruptCurrentTts: true
      exam:

  # ============================================================
  # 规则 3：有脉搏患者启动 CPR → 拦截
  # ============================================================
  - id: "CPR_ON_PULSE_PATIENT"
    description: "对有脉搏、有灌注的不稳定窄QRS心动过速患者启动胸外按压。"
    triggerIntent: "S-102-3-3"
    condition: |
      #phys.hasPulse == true
    severity: "CRITICAL"
    keepCurrent: true
    unityStateName: "室上速(SVT)"
    effects:
      - var: "process.cprOnPulseBlocked"
        value: true
    feedback:
      teaching:
        tts: "该患者有脉搏、有灌注。有脉搏心动过速不需要胸外按压，应专注同步电复律。按压会造成肋骨骨折等伤害。"
      learning:
        tts: "患者有脉搏！不要按压，直接同步电复律！"
        interruptCurrentTts: true
      exam:

  # ============================================================
  # 规则 4：未开启 SYNC 模式放电 → 诱发室颤
  # ============================================================
  - id: "UNSYNC_SHOCK_CAUSES_VF"
    description: "未开启 SYNC 模式对不稳定的有脉搏心动过速放电，可诱发室颤。"
    triggerIntent: "S-102-2-6"
    condition: |
      #device.defibSyncMode == false
    severity: "CRITICAL"
    keepCurrent: false
    jumpTo: "F-102-DETERIORATION"
    unityStateName: "室颤(VF)"          # ★ 白名单值
    effects:
      - var: "process.unsyncShockVfTriggered"
        value: true
    feedback:
      teaching:
        tts: "严重错误：未开启 SYNC 模式就放电，R 波可能落在 T 波易感期诱发室颤。有脉搏的心动过速必须开启同步模式后再放电。"
      learning:
        tts: "⛔ 非同步放电已诱发室颤！立即启动 ACLS/CPR！"
        interruptCurrentTts: true
      exam:

  # ============================================================
  # 规则 5：未镇静就放电（警告）
  # ============================================================
  - id: "CARDIOVERSION_WITHOUT_SEDATION"
    description: "未给予镇静就对清醒患者进行同步电复律。"
    triggerIntent: "S-102-2-6"
    condition: |
      #intervention.sedation.given == false &&
      #phys.consciousness != 'unresponsive'
    severity: "MINOR"
    keepCurrent: true
    unityStateName: "室上速(SVT)"
    effects:
      - var: "process.sedationMissingWarning"
        value: true
    feedback:
      teaching:
        tts: "患者清醒，未给镇静就放电会造成疼痛与心理创伤。应在放电前给予咪达唑仑或依托咪酯。"
      learning:
        tts: "⚠️ 未给予镇静，患者会感到疼痛。下次记得先镇静。"
        interruptCurrentTts: false
      exam:

  # ============================================================
  # 规则 6：对稳定患者误做同步电复律（阻止类）
  # ============================================================
  - id: "CARDIOVERSION_ON_STABLE_PATIENT"
    description: "对血流动力学稳定的窄QRS心动过速患者进行同步电复律属过度医疗。"
    triggerIntent: "S-102-2-6"
    condition: |
      #derived.stable == true
    severity: "CRITICAL"
    keepCurrent: true
    unityStateName: "室上速(SVT)"
    effects:
      - var: "process.stableCardioversionBlocked"
        value: true
    feedback:
      teaching:
        tts: "注意：该患者血流动力学稳定。稳定窄QRS心动过速应走迷走神经刺激 → 腺苷阶梯，不应直接电复律。"
      learning:
        tts: "患者稳定，不需要电复律！先尝试迷走神经刺激。"
        interruptCurrentTts: true
      exam:

  # ============================================================
  # 规则 7：能量超上限（警告）
  # ============================================================
  - id: "CARDIOVERSION_ENERGY_TOO_HIGH"
    description: "窄QRS规则心动过速选择超过 100J 的同步电复律能量。"
    triggerIntent: "S-102-2-2"
    condition: |
      #energy > 100
    severity: "MINOR"
    keepCurrent: true
    unityStateName: "室上速(SVT)"
    effects:
      - var: "process.excessEnergyWarning"
        value: true
    feedback:
      teaching:
        tts: "窄QRS规则心动过速 50-100J 足够，过高能量增加心肌损伤风险。"
      learning:
        tts: "⚠️ 能量偏高，窄QRS规则心动过速建议 50-100J。"
        interruptCurrentTts: false
      exam:

  # ============================================================
  # 规则 8：首次干预超过 2 分钟 → 恶化
  #
  # ★ 修复要点（2026-09-21）：
  #   删除 #evaluation.timeToFirstIntervention == null 条件。
  #   该变量从未被任何技能写入，默认值若为 0 则 == null 恒 false，
  #   导致整个 condition 永远不成立。
  #   process.timeElapsedSinceLastIntervention 已覆盖语义：
  #   每次有效技能执行后会重置为 0，> 120 即代表"已过 120 秒无干预"。
  #
  #   注：本规则未写 triggerIntent（保持原状），与定时评估路径的
  #   intentId=null 匹配。请勿添加 triggerIntent: "*"。
  #
  # ★ 修复要点（2026-09-22）：
  #   condition 增加 #process.timeoutOccurred != true。
  #   本规则 effects 会写入 process.timeoutOccurred=true；
  #   若不判断它，则后续每条指令都会再次命中，导致"异常层命中，
  #   跳过正常 skill"刷屏。变量未写入时为 null，null != true 求值为 true，
  #   所以首次触发不会被短路。
  # ============================================================
  - id: "DELAYED_FIRST_INTERVENTION"
    description: "超过 2 分钟仍未对不稳定窄QRS心动过速进行干预。"
    # ★ 不写 triggerIntent（空 = 任意意图都匹配）
    # ★ FIX 2026-09-22：加 timeoutOccurred 短路，避免每轮指令反复命中
    condition: |
      #process.timeoutOccurred != true &&
      #process.timeElapsedSinceLastIntervention != null &&
      #process.timeElapsedSinceLastIntervention > 120
    severity: "TIMING"
    keepCurrent: false
    jumpTo: "F-102-DETERIORATION"
    unityStateName: "心搏停止(Asystole)"     # ★ 白名单值
    effects:
      - var: "process.timeoutOccurred"
        value: true
    feedback:
      teaching:
        tts: "已超过 2 分钟未采取干预。不稳定心动过速每延误一分钟，死亡率显著上升。患者已出现循环崩溃。"
      learning:
        tts: "太慢了！不稳定心动过速应立即电复律。"
        interruptCurrentTts: true
      exam:

  # ============================================================
  # 规则 9：电复律 3 次失败 → 应换策略
  # ============================================================
  - id: "REFRACTORY_AFTER_3_SHOCKS"
    description: "同步电复律 3 次仍未转复。"
    triggerIntent: "S-102-2-6"
    condition: |
      #intervention.cardioversion.count != null &&
      #intervention.cardioversion.count >= 3 &&
      #intervention.rhythmConverted == false
    severity: "CRITICAL"
    keepCurrent: false
    jumpTo: "F-102-SECOND_SHOCK_PREP"
    unityStateName: "室上速(SVT)"
    effects:
      - var: "process.refractoryDeclared"
        value: true
    feedback:
      teaching:
        tts: "三次电复律仍未转复，患者已属难治性心动过速。需要重新评估：能量是否足够？是否给了抗心律失常药？电极位置是否正确？"
      learning:
        tts: "3 次未转复！需要换策略，不要重复同样的操作。"
      exam:

  # ============================================================
  # 规则 10：转复后 30s 未复评
  # ============================================================
  - id: "NO_POST_CONVERSION_REASSESSMENT"
    description: "心律转复后 30 秒内未进行复评。"
    # ★ 不写 triggerIntent
    condition: |
      #process.timeElapsedSinceLastIntervention != null &&
      #process.timeElapsedSinceLastIntervention > 30 &&
      #intervention.rhythmConverted == true &&
      #process.reassessed == false
    severity: "TIMING"
    keepCurrent: false
    jumpTo: "F-102-POST_SHOCK_ASSESS"
    unityStateName: "正常窦性心律"
    effects:
      - var: "process.reassessed"
        value: true
    feedback:
      teaching:
        tts: "心律转复后应尽快复评：确认心律稳定性、生命体征、意识状态。30 秒内完成评估是标准流程。"
      learning:
        tts: "转复后别忘了复评！"
      exam:
