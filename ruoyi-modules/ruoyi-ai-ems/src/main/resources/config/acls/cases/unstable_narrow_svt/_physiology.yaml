# ================================================================
# 窄QRS不稳定心动过速（Unstable Narrow QRS / SVT）生理预设
# 案例编号：102
# 存放位置：cases/unstable_narrow_svt/_physiology.yaml
#
# 字段约束：StatePhysiology 仅支持以下 9 个生理字段 + transitionDuration
#   phys.heartRate / phys.systolicBp / phys.diastolicBp / phys.spo2
#   phys.respiratoryRate / phys.consciousness / phys.qrsDuration
#   phys.rrIntervalJitter / phys.rhythm
#   transition_duration（无前缀）
# 不支持的字段（如 phys.skinCondition / capillaryRefill / hasPulse）
# 请在 operation_effects 或运行时叠加层处理，不能写在 state_physiology 里。
# ================================================================

default_transition_duration: 10

state_physiology:

  # 初始评估：不稳定起点
  F-000-INITIAL_ASSESSMENT:
    phys.heartRate: 175
    phys.systolicBp: 88
    phys.diastolicBp: 55
    phys.spo2: 94
    phys.respiratoryRate: 28
    phys.consciousness: "verbal"
    transition_duration: 5

  # 初始设置
  F-000-INITIAL_SETUP:
    phys.heartRate: 175
    phys.systolicBp: 88
    phys.diastolicBp: 55
    phys.spo2: 94
    phys.respiratoryRate: 28
    phys.consciousness: "verbal"
    transition_duration: 5

  # QRS 宽度判读
  F-102-CHECK_QRS_WIDTH:
    phys.heartRate: 175
    phys.systolicBp: 88
    phys.diastolicBp: 55
    phys.spo2: 94
    phys.respiratoryRate: 28
    phys.consciousness: "verbal"
    phys.qrsDuration: 0.08
    phys.rrIntervalJitter: 0.04
    phys.rhythm: "SVT"

  # 不稳定确认
  F-102-CONFIRM_UNSTABLE:
    phys.heartRate: 178
    phys.systolicBp: 85
    phys.diastolicBp: 52
    phys.spo2: 93
    phys.respiratoryRate: 29
    phys.consciousness: "verbal"
    transition_duration: 5

  # 电复律准备（模式 + 能量 + 镇静 + 清场）
  F-102-PREP_CARDIOVERSION:
    phys.heartRate: 180
    phys.systolicBp: 82
    phys.diastolicBp: 50
    phys.spo2: 92
    phys.respiratoryRate: 30
    phys.consciousness: "pain"
    transition_duration: 8

  # 放电
  F-102-DELIVER_SHOCK:
    phys.heartRate: 182
    phys.systolicBp: 78
    phys.diastolicBp: 46
    phys.spo2: 90
    phys.respiratoryRate: 30
    phys.consciousness: "pain"
    transition_duration: 5

  # 复律后评估（转复成功）
  F-102-POST_SHOCK_ASSESS:
    phys.heartRate: 95
    phys.systolicBp: 118
    phys.diastolicBp: 72
    phys.spo2: 97
    phys.respiratoryRate: 20
    phys.consciousness: "verbal"
    phys.rhythm: "Sinus"
    transition_duration: 20

  # 窦性监测
  F-102-MONITOR_SINUS_RHYTHM:
    phys.heartRate: 82
    phys.systolicBp: 125
    phys.diastolicBp: 78
    phys.spo2: 98
    phys.respiratoryRate: 18
    phys.consciousness: "alert"
    phys.rhythm: "Sinus"
    transition_duration: 25

  # 二次电复律准备
  F-102-SECOND_SHOCK_PREP:
    phys.heartRate: 180
    phys.systolicBp: 80
    phys.diastolicBp: 48
    phys.spo2: 91
    phys.respiratoryRate: 30
    phys.consciousness: "pain"
    transition_duration: 10

  # 病情恶化（PEA/停搏）
  F-102-DETERIORATION:
    phys.heartRate: 0
    phys.systolicBp: 0
    phys.diastolicBp: 0
    phys.spo2: 60
    phys.respiratoryRate: 0
    phys.consciousness: "unresponsive"
    phys.rhythm: "PEA"
    transition_duration: 5

  # 退出到父级
  F-102-EXIT_TO_PARENT:
    phys.heartRate: 85
    phys.systolicBp: 125
    phys.diastolicBp: 78
    phys.spo2: 98
    phys.respiratoryRate: 18
    phys.consciousness: "alert"
    phys.rhythm: "Sinus"
    transition_duration: 10

# ================================================================
# 操作效果叠加层
# 注意：这里的 key 是"操作标识"，由技能执行时按名字引用
# 子字段（target / delta / duration / recovery / curve）需要与
# OperationEffect 类的字段名一致；启动如报字段错，按报错信息调整。
# ================================================================
operation_effects:

  CARDIOVERSION_100J:
    - target: phys.heartRate
      delta: -100
      duration: 3
      recovery: 8
      curve: INSTANT_DROP_LINEAR_RECOVER
    - target: phys.systolicBp
      delta: 40
      duration: 5
      recovery: 10
      curve: LINEAR_RISE_LINEAR_RECOVER

  CARDIOVERSION_200J:
    - target: phys.heartRate
      delta: -110
      duration: 3
      recovery: 8
      curve: INSTANT_DROP_LINEAR_RECOVER
    - target: phys.systolicBp
      delta: 45
      duration: 5
      recovery: 10
      curve: LINEAR_RISE_LINEAR_RECOVER

  SEDATION_MIDAZOLAM:
    - target: phys.consciousness
      delta: -1
      duration: 120
      recovery: 180
      curve: INSTANT_DROP_LINEAR_RECOVER
    - target: phys.respiratoryRate
      delta: -4
      duration: 60
      recovery: 90
      curve: LINEAR_DECAY_LINEAR_RECOVER

  SEDATION_ETOMIDATE:
    - target: phys.consciousness
      delta: -1
      duration: 120
      recovery: 180
      curve: INSTANT_DROP_LINEAR_RECOVER
    - target: phys.respiratoryRate
      delta: -3
      duration: 60
      recovery: 90
      curve: LINEAR_DECAY_LINEAR_RECOVER

  UNSYNCHRONIZED_SHOCK_VF:
    - target: phys.heartRate
      delta: -200
      duration: 1
      recovery: 0
      curve: INSTANT_DROP_NO_RECOVER

  ADENOSINE_WPW_VF:
    - target: phys.heartRate
      delta: -180
      duration: 1
      recovery: 0
      curve: INSTANT_DROP_NO_RECOVER

  SECOND_CARDIOVERSION:
    - target: phys.heartRate
      delta: -110
      duration: 3
      recovery: 8
      curve: INSTANT_DROP_LINEAR_RECOVER
    - target: phys.systolicBp
      delta: 40
      duration: 5
      recovery: 10
      curve: LINEAR_RISE_LINEAR_RECOVER
