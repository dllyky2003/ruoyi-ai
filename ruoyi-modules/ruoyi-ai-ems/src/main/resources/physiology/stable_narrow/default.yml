# ================================================================
# 窄QRS稳定心动过速（SVT）生理预设
# 案例编号：101
# 存储位置：classpath:physiology/stable_narrow/default.yml
# ================================================================

config_version: "1.0.0"
default_transition_duration: 10

# 服务端心律语义 → Unity stateName
rhythm_mapping:
  sinus: "正常窦性心律"
  svt: "室上速(SVT)"
  stable_narrow: "稳定性窄QRS心动过速"
  vt: "单形性室速"
  vf: "室颤"
  asystole: "心室停搏"

# ================================================================
# 状态生理基线
# key = 状态机状态 ID（与 _statemachine.yaml 完全一致）
# 内部字段带 phys. 前缀，通过 StatePhysiology 的 @JsonAlias 兼容
# ================================================================
state_physiology:

  F-000-INITIAL_ASSESSMENT:
    phys.heartRate: 150
    phys.systolicBp: 145
    phys.diastolicBp: 90
    phys.spo2: 98
    phys.respiratoryRate: 22
    phys.consciousness: "alert"
    transition_duration: 5

  F-000-INITIAL_SETUP:
    phys.heartRate: 150
    phys.systolicBp: 145
    phys.diastolicBp: 90
    phys.spo2: 98
    phys.respiratoryRate: 22
    phys.consciousness: "alert"
    transition_duration: 5

  F-101-ASSESS_STABILITY:
    phys.heartRate: 150
    phys.systolicBp: 145
    phys.diastolicBp: 90
    phys.spo2: 98
    phys.respiratoryRate: 22
    phys.consciousness: "alert"
    transition_duration: 5

  F-101-CHECK_QRS_WIDTH:
    phys.heartRate: 150
    phys.systolicBp: 145
    phys.diastolicBp: 90
    phys.spo2: 98
    phys.respiratoryRate: 22
    phys.consciousness: "alert"

  F-101-CHECK_RHYTHM:
    phys.heartRate: 150
    phys.systolicBp: 145
    phys.diastolicBp: 90
    phys.spo2: 98
    phys.respiratoryRate: 22
    phys.consciousness: "alert"

  F-101-DO_VAGAL_MANEUVER:
    phys.heartRate: 148
    phys.systolicBp: 142
    phys.diastolicBp: 88
    phys.spo2: 98
    phys.respiratoryRate: 22
    phys.consciousness: "alert"
    transition_duration: 15

  F-101-DO_ADENOSINE_6MG:
    phys.heartRate: 145
    phys.systolicBp: 138
    phys.diastolicBp: 85
    phys.spo2: 98
    phys.respiratoryRate: 22
    phys.consciousness: "alert"
    transition_duration: 20

  F-101-DO_ADENOSINE_12MG:
    phys.heartRate: 155
    phys.systolicBp: 135
    phys.diastolicBp: 82
    phys.spo2: 97
    phys.respiratoryRate: 24
    phys.consciousness: "alert"
    transition_duration: 20

  F-101-DO_SECOND_LINE_DRUG:
    phys.heartRate: 160
    phys.systolicBp: 125
    phys.diastolicBp: 75
    phys.spo2: 96
    phys.respiratoryRate: 26
    phys.consciousness: "verbal"
    transition_duration: 30

  F-101-MONITOR_SINUS_RHYTHM:
    phys.heartRate: 85
    phys.systolicBp: 130
    phys.diastolicBp: 80
    phys.spo2: 99
    phys.respiratoryRate: 18
    phys.consciousness: "alert"
    transition_duration: 25

  F-101-UNSTABLE_CARDIOVERSION:
    phys.heartRate: 180
    phys.systolicBp: 78
    phys.diastolicBp: 50
    phys.spo2: 92
    phys.respiratoryRate: 30
    phys.consciousness: "pain"
    transition_duration: 20

  F-101-EXIT_TO_PARENT:
    phys.heartRate: 85
    phys.systolicBp: 130
    phys.diastolicBp: 80
    phys.spo2: 99
    phys.respiratoryRate: 18
    phys.consciousness: "alert"
    transition_duration: 10

# ================================================================
# 操作效果：叠加到基线之上
# 字段：target / delta / duration / recovery / curve
# ================================================================
operation_effects:

  ADENOSINE_6MG:
    - target: phys.heartRate
      delta: -150
      duration: 8
      recovery: 12
      curve: INSTANT_DROP_LINEAR_RECOVER

  ADENOSINE_12MG:
    - target: phys.heartRate
      delta: -160
      duration: 10
      recovery: 15
      curve: INSTANT_DROP_LINEAR_RECOVER

# ================================================================
# 体征演变规则（原文件没有，先留空，后续需要可补）
# ================================================================
evolution_rules: []
