# ================================================================
# 窄QRS稳定心动过速（SVT）生理预设
# 案例编号：101
# 存储位置：classpath:physiology/stable_narrow/default.yml
# ================================================================

config_version: "1.1.0"
default_transition_duration: 10

# 服务端心律语义 → Unity stateName
rhythm_mapping:
  sinus: "正常窦性心律"
  svt: "室上速(SVT)"
  stable_narrow: "稳定性窄QRS心动过速"
  vt: "单形性室速"
  vf: "室颤"
  asystole: "心室停搏"

# ================================================================
