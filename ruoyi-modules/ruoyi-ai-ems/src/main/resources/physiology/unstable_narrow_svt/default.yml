# ================================================================
# 窄QRS不稳定心动过速（Unstable Narrow QRS / SVT）
# 案例编号：102
# ================================================================

config_version: "1.0.0"
default_transition_duration: 10

# 服务端心律语义 → Unity stateName
rhythm_mapping:
  sinus: "正常窦性心律"
  stable_narrow: "稳定性窄QRS心动过速"
  svt: "室上速(SVT)"
  vt: "单形性室速"
  vf: "室颤"
  pea: "无脉电活动"
  asystole: "心室停搏"

# ================================================================
# 状态生理基线
# key = 状态机状态 ID
# ================================================================
state_physiology:

  F-000-INITIAL_ASSESSMENT:
    phys.heartRate: 175
    phys.systolicBp: 88
    phys.diastolicBp: 55
    phys.spo2: 94
    phys.respiratoryRate: 28
    phys.consciousness: "verbal"
    transition_duration: 5

  F-000-INITIAL_SETUP:
    phys.heartRate: 175
    phys.systolicBp: 88
    phys.diastolicBp: 55
    phys.spo2: 94
    phys.respiratoryRate: 28
    phys.consciousness: "verbal"
    transition_duration: 5

  F-102-CHECK_QRS_WIDTH:
    phys.heartRate: 175
    phys.systolicBp: 88
    phys.diastolicBp: 55
    phys.spo2: 94
    phys.respiratoryRate: 28
    phys.consciousness: "verbal"
    phys.qrsDuration: 0.08
    phys.rrIntervalJitter: 0.04
    phys.rhythm: "SVT"

  F-102-CONFIRM_UNSTABLE:
    phys.heartRate: 178
    phys.systolicBp: 85
    phys.diastolicBp: 52
    phys.spo2: 93
    phys.respiratoryRate: 29
    phys.consciousness: "verbal"
    transition_duration: 5

  F-102-PREP_CARDIOVERSION:
    phys.heartRate: 180
    phys.systolicBp: 82
    phys.diastolicBp: 50
    phys.spo2: 92
    phys.respiratoryRate: 30
    phys.consciousness: "pain"
    transition_duration: 8

  F-102-DELIVER_SHOCK:
    phys.heartRate: 182
    phys.systolicBp: 78
    phys.diastolicBp: 46
    phys.spo2: 90
    phys.respiratoryRate: 30
    phys.consciousness: "pain"
    transition_duration: 5

  F-102-POST_SHOCK_ASSESS:
    phys.heartRate: 95
    phys.systolicBp: 118
    phys.diastolicBp: 72
    phys.spo2: 97
    phys.respiratoryRate: 20
    phys.consciousness: "verbal"
    phys.rhythm: "Sinus"
    transition_duration: 20

  F-102-MONITOR_SINUS_RHYTHM:
    phys.heartRate: 82
    phys.systolicBp: 125
    phys.diastolicBp: 78
    phys.spo2: 98
    phys.respiratoryRate: 18
    phys.consciousness: "alert"
    phys.rhythm: "Sinus"
    transition_duration: 25

  F-102-SECOND_SHOCK_PREP:
    phys.heartRate: 180
    phys.systolicBp: 80
    phys.diastolicBp: 48
    phys.spo2: 91
    phys.respiratoryRate: 30
    phys.consciousness: "pain"
    transition_duration: 10

  F-102-DETERIORATION:
    phys.heartRate: 0
    phys.systolicBp: 0
    phys.diastolicBp: 0
    phys.spo2: 60
    phys.respiratoryRate: 0
    phys.consciousness: "unresponsive"
    phys.rhythm: "PEA"
    transition_duration: 5

  F-102-EXIT_TO_PARENT:
    phys.heartRate: 85
    phys.systolicBp: 125
    phys.diastolicBp: 78
    phys.spo2: 98
    phys.respiratoryRate: 18
    phys.consciousness: "alert"
    phys.rhythm: "Sinus"
    transition_duration: 10

# ================================================================
# 操作效果
# ================================================================
operation_effects:

  CARDIOVERSION_100J:
    - target: phys.heartRate
      delta: -100
      duration: 3
      recovery: 8
      curve: INSTANT_DROP_LINEAR_RECOVER
    - target: phys.systolicBp
      delta: 40
      duration: 5
      recovery: 10
      curve: LINEAR_DECAY_LINEAR_RECOVER

  CARDIOVERSION_200J:
    - target: phys.heartRate
      delta: -110
      duration: 3
      recovery: 8
      curve: INSTANT_DROP_LINEAR_RECOVER
    - target: phys.systolicBp
      delta: 45
      duration: 5
      recovery: 10
      curve: LINEAR_DECAY_LINEAR_RECOVER

  SEDATION_MIDAZOLAM:
    - target: phys.consciousness
      delta: 0
      duration: 120
      recovery: 180
      curve: LINEAR_DECAY_LINEAR_RECOVER
    - target: phys.respiratoryRate
      delta: -4
      duration: 60
      recovery: 90
      curve: LINEAR_DECAY_LINEAR_RECOVER

  SEDATION_ETOMIDATE:
    - target: phys.consciousness
      delta: 0
      duration: 120
      recovery: 180
      curve: LINEAR_DECAY_LINEAR_RECOVER
    - target: phys.respiratoryRate
      delta: -3
      duration: 60
      recovery: 90
      curve: LINEAR_DECAY_LINEAR_RECOVER

  UNSYNCHRONIZED_SHOCK_VF:
    - target: phys.heartRate
      delta: -200
      duration: 1
      recovery: 0
      curve: INSTANT_DROP_LINEAR_RECOVER

  ADENOSINE_WPW_VF:
    - target: phys.heartRate
      delta: -180
      duration: 1
      recovery: 0
      curve: INSTANT_DROP_LINEAR_RECOVER

  SECOND_CARDIOVERSION:
    - target: phys.heartRate
      delta: -110
      duration: 3
      recovery: 8
      curve: INSTANT_DROP_LINEAR_RECOVER
    - target: phys.systolicBp
      delta: 40
      duration: 5
      recovery: 10
      curve: LINEAR_DECAY_LINEAR_RECOVER

evolution_rules:
  - rhythm: "svt"
    variable: "phys.systolicBp"
    after_seconds: 30
    delta: -10.0
  - rhythm: "svt"
    variable: "phys.systolicBp"
    after_seconds: 60
    delta: -20.0
  - rhythm: "vt"
    variable: "phys.spo2"
    after_seconds: 20
    delta: -0.05
